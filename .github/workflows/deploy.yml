name: Deploy to Oracle Cloud VM (Port 6060)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud (84.13.83.163:6060)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.ORACLE_PORT || '22' }} -H ${{ secrets.ORACLE_HOST || '84.13.83.163' }} >> ~/.ssh/known_hosts

      - name: Ensure Target Directory Exists
        run: |
          ssh -p ${{ secrets.ORACLE_PORT || '22' }} ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST || '84.13.83.163' }} "sudo mkdir -p /var/www/gas && sudo chown -R ${{ secrets.ORACLE_USER }}:${{ secrets.ORACLE_USER }} /var/www/gas"

      - name: Sync Files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.ORACLE_PORT || '22' }}" \
            --exclude '.git*' \
            --exclude '*.bak' \
            ./ ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST || '84.13.83.163' }}:/var/www/gas/

      - name: Configure Nginx Port 6060 & Firewall
        run: |
          ssh -p ${{ secrets.ORACLE_PORT || '22' }} ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST || '84.13.83.163' }} << 'EOF'
            sudo chmod -R 755 /var/www/gas

            # Nginx Port 6060 Configuration
            if [ -d "/etc/nginx/conf.d" ]; then
              sudo cp /var/www/gas/nginx/gas.conf /etc/nginx/conf.d/gas.conf
            fi

            if [ -d "/etc/nginx/sites-available" ]; then
              sudo cp /var/www/gas/nginx/gas.conf /etc/nginx/sites-available/gas.conf
              sudo ln -sf /etc/nginx/sites-available/gas.conf /etc/nginx/sites-enabled/gas.conf
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # Open Port 6060 in Firewall (iptables / ufw)
            if command -v ufw > /dev/null 2>&1; then
              sudo ufw allow 6060/tcp || true
            fi

            if command -v iptables > /dev/null 2>&1; then
              sudo iptables -I INPUT 6 -p tcp --dport 6060 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 6060 -j ACCEPT 2>/dev/null || true
            fi

            # Reload Web Server
            if command -v nginx > /dev/null 2>&1 && systemctl is-active --quiet nginx; then
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "🚀 Deployed successfully to http://84.13.83.163:6060"
          EOF
