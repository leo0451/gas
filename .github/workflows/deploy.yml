name: Deploy to Oracle Cloud VM (Port 6060)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud (84.13.83.163:6060)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Connection Parameters
        run: |
          # 1. Clean Host (strip http://, https://, ports, slashes, spaces)
          RAW_HOST="${{ secrets.ORACLE_HOST }}"
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E -e 's|^https?://||' -e 's|:[0-9]+.*$||' -e 's|/.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_HOST" ]; then
            CLEAN_HOST="84.13.83.163"
          fi

          # 2. Clean User (strip all spaces)
          RAW_USER="${{ secrets.ORACLE_USER }}"
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          if [ -z "$CLEAN_USER" ]; then
            CLEAN_USER="ubuntu"
          fi

          # 3. Clean Port
          RAW_PORT="${{ secrets.ORACLE_PORT }}"
          CLEAN_PORT=$(echo "$RAW_PORT" | tr -d '[:space:]')
          if [ -z "$CLEAN_PORT" ]; then
            CLEAN_PORT="22"
          fi

          echo "TARGET_HOST=$CLEAN_HOST" >> $GITHUB_ENV
          echo "TARGET_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "TARGET_PORT=$CLEAN_PORT" >> $GITHUB_ENV

          echo "Target Host: $CLEAN_HOST"
          echo "Target User: $CLEAN_USER"
          echo "Target Port: $CLEAN_PORT"

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $TARGET_PORT -H $TARGET_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare Remote Directory
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p $TARGET_PORT ${TARGET_USER}@${TARGET_HOST} \
            "sudo mkdir -p /var/www/gas && sudo chown -R ${TARGET_USER}:${TARGET_USER} /var/www/gas"

      - name: Sync Code via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p $TARGET_PORT" \
            --exclude '.git*' \
            --exclude '*.bak' \
            ./ ${TARGET_USER}@${TARGET_HOST}:/var/www/gas/

      - name: Configure Nginx Port 6060 & Firewall
        run: |
          ssh -o StrictHostKeyChecking=no -p $TARGET_PORT ${TARGET_USER}@${TARGET_HOST} << 'EOF'
            sudo chmod -R 755 /var/www/gas

            # Nginx Port 6060 Configuration
            if [ -d "/etc/nginx/conf.d" ]; then
              sudo cp /var/www/gas/nginx/gas.conf /etc/nginx/conf.d/gas.conf
            fi

            if [ -d "/etc/nginx/sites-available" ]; then
              sudo cp /var/www/gas/nginx/gas.conf /etc/nginx/sites-available/gas.conf
              sudo ln -sf /etc/nginx/sites-available/gas.conf /etc/nginx/sites-enabled/gas.conf
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # Open Port 6060 in Firewall (iptables / ufw)
            if command -v ufw > /dev/null 2>&1; then
              sudo ufw allow 6060/tcp || true
            fi

            if command -v iptables > /dev/null 2>&1; then
              sudo iptables -I INPUT 6 -p tcp --dport 6060 -m conntrack --ctstate NEW,ESTABLISHED -j ACCEPT 2>/dev/null || sudo iptables -I INPUT -p tcp --dport 6060 -j ACCEPT 2>/dev/null || true
            fi

            # Reload Web Server
            if command -v nginx > /dev/null 2>&1 && systemctl is-active --quiet nginx; then
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "🚀 Deployed successfully to http://84.13.83.163:6060"
          EOF
