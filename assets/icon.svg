<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#193846" />
      <stop offset="70%" stop-color="#0c191f" />
      <stop offset="100%" stop-color="#081014" />
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Tech Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#2a5568" stroke-width="4" stroke-dasharray="16,8" opacity="0.6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f5a623" stroke-width="4" opacity="0.8"/>

  <!-- Industrial Flame / Telemetry Graphic -->
  <g filter="url(#glow)">
    <path d="M256,90 C290,150 335,210 335,275 C335,325 300,365 256,365 C212,365 177,325 177,275 C177,210 222,150 256,90 Z" fill="url(#flameGrad)"/>
    <path d="M256,170 C274,210 295,245 295,280 C295,308 277,330 256,330 C235,330 217,308 217,280 C217,245 238,210 256,170 Z" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">GAS SCADA</text>
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#f5a623" text-anchor="middle" letter-spacing="6">MACHSOFT</text>
</svg>
