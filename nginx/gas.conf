server {
    listen 6060;
    server_name 84.13.83.163;

    root /var/www/gas;
    index index.html;

    # Gzip compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Service Worker: Do not cache
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Web App Manifest
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache control for assets and icons
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 404 /index.html;
}
